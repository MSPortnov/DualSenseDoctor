# Builds the plugin and publishes a GitHub release when a version tag (v1.2.3) is pushed.
# The release asset is always called DualSenseDoctor.zip, so .../releases/latest/download/DualSenseDoctor.zip always works.
# Create a release: raise the version in package.json and main.py, commit, then git tag v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches package.json and main.py
        run: |
          V="$(jq -r .version package.json)"
          P="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' main.py | head -1)"
          if [ "v$V" != "$GITHUB_REF_NAME" ] || [ "$P" != "$V" ]; then
            echo "Tag $GITHUB_REF_NAME, package.json $V and main.py $P must all be the same version"
            exit 1
          fi

      - name: Check the Python backend
        run: python3 -m py_compile main.py

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Package
        run: |
          mkdir -p "out/DualSense Doctor"
          cp -r dist main.py plugin.json package.json LICENSE THIRD_PARTY_NOTICES.md README.md "out/DualSense Doctor/"
          (cd out && zip -qr ../DualSenseDoctor.zip "DualSense Doctor")
          sha256sum DualSenseDoctor.zip > DualSenseDoctor.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" DualSenseDoctor.zip DualSenseDoctor.zip.sha256 --title "DualSense Doctor $GITHUB_REF_NAME" --generate-notes
