name: release

# Builds the plugin and attaches a zip that Decky can install in developer mode
# ("Install plugin from ZIP"). Create a release by pushing a tag, for example: git tag vX.Y.Z && git push --tags

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Autotests
        run: python3 -m unittest discover -s tests
      - name: Read plugin version
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          mkdir -p "pkg/DualSense Doctor"
          cp -r dist py_modules main.py plugin.json package.json LICENSE README.md "pkg/DualSense Doctor/"
          (cd pkg && zip -r "../DualSenseDoctor-${VERSION}.zip" "DualSense Doctor")
      - uses: softprops/action-gh-release@v2
        with:
          files: DualSenseDoctor-${{ steps.version.outputs.number }}.zip
